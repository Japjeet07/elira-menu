<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Roots &middot; Menu</title>
<meta name="theme-color" content="#3d5225">
<meta name="description" content="The full Roots menu. Tap any section to zoom in.">
<meta name="robots" content="noindex">
<meta property="og:type" content="website">
<meta property="og:title" content="Roots &middot; Menu">
<meta property="og:description" content="The full Roots menu. Tap any section to zoom in.">
<meta property="og:image" content="s01.jpg">
<link rel="preload" as="image" href="s01.webp" type="image/webp">
<style>
  :root {
    --paper: #efe6d4;
    --ink: #2f2a21;
    --green: #3d5225;
    --muted: #8d8065;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { background: var(--paper); }
  body {
    background: var(--paper);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-text-size-adjust: 100%;
    padding: 0 0 env(safe-area-inset-bottom);
  }
  .wrap { max-width: 1320px; margin: 0 auto; padding: 10px; }
  header { text-align: center; padding: 26px 10px 2px; }
  header .name {
    font-size: 26px;
    font-weight: 800;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: var(--green);
  }
  header .rule {
    width: 54px; height: 3px;
    background: var(--green);
    opacity: .55;
    border-radius: 2px;
    margin: 12px auto 0;
  }
  .hint {
    text-align: center;
    font-size: 12px;
    letter-spacing: 0.09em;
    text-transform: uppercase;
    color: var(--muted);
    padding: 12px 10px 16px;
  }
  nav {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 7px;
    padding: 0 4px 22px;
  }
  nav a {
    font-size: 12.5px;
    line-height: 1;
    padding: 9px 13px;
    border-radius: 999px;
    border: 1px solid rgba(61,82,37,.28);
    color: var(--green);
    text-decoration: none;
    background: rgba(255,255,255,.5);
  }
  .sections {
    display: grid;
    grid-template-columns: 1fr;
    gap: 16px;
  }
  @media (min-width: 680px)  { .sections { grid-template-columns: repeat(2, 1fr); } }
  @media (min-width: 1020px) { .sections { grid-template-columns: repeat(3, 1fr); } }
  figure {
    background: #fff;
    border-radius: 14px;
    overflow: hidden;
    box-shadow: 0 1px 3px rgba(47,42,33,.14), 0 8px 24px rgba(47,42,33,.08);
    cursor: zoom-in;
    scroll-margin-top: 12px;
  }
  figure img {
    display: block;
    width: 100%;
    height: auto;
    -webkit-touch-callout: none;
    -webkit-user-select: none;
    user-select: none;
    -webkit-user-drag: none;
  }
  /* full-screen zoom view */
  #zoom {
    position: fixed;
    inset: 0;
    background: rgba(26,24,18,.97);
    display: none;
    overflow: auto;
    -webkit-overflow-scrolling: touch;
    z-index: 50;
  }
  #zoom.open { display: block; }
  #zoom img {
    display: block;
    max-width: none;
    height: auto;
    margin: 0 auto;
    -webkit-touch-callout: none;
    user-select: none;
  }
  #close {
    position: fixed;
    top: calc(10px + env(safe-area-inset-top));
    right: 12px;
    z-index: 60;
    width: 44px; height: 44px;
    border: 0; border-radius: 50%;
    background: var(--green);
    color: #f3eee0;
    font-size: 24px; line-height: 44px;
    font-weight: 700;
    display: none;
    cursor: pointer;
    box-shadow: 0 2px 10px rgba(0,0,0,.4);
  }
  .foot {
    text-align: center;
    font-size: 12px;
    color: var(--muted);
    padding: 26px 10px 30px;
  }
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="name">Roots</div>
      <div class="rule"></div>
    </header>
    <p class="hint">Tap a section to zoom &middot; pinch to zoom further</p>

    <nav>
      <a href="#s01">Breakfast Drinks</a>
      <a href="#s02">Salads &amp; Chaats</a>
      <a href="#s03">Beverages</a>
      <a href="#s04">Kids Menu</a>
      <a href="#s05">Vegetarian Breakfast</a>
      <a href="#s06">Non-Vegetarian Breakfast</a>
      <a href="#s07">Vegetarian Starters</a>
      <a href="#s08">Non-Vegetarian Starters</a>
      <a href="#s09">Vegetarian Main Course</a>
      <a href="#s10">Non-Vegetarian Main Course</a>
    </nav>

    <div class="sections">
      <figure id="s01" data-full="s01">
        <picture>
          <source srcset="s01.webp" type="image/webp">
          <img src="s01.jpg" alt="Breakfast drinks: juices, shakes and smoothies" width="1240" height="2204" fetchpriority="high" decoding="async">
        </picture>
      </figure>
      <figure id="s02" data-full="s02">
        <picture>
          <source srcset="s02.webp" type="image/webp">
          <img src="s02.jpg" alt="Salads and chaats" width="1240" height="2204" loading="lazy" decoding="async">
        </picture>
      </figure>
      <figure id="s03" data-full="s03">
        <picture>
          <source srcset="s03.webp" type="image/webp">
          <img src="s03.jpg" alt="Beverages: coffees, teas and chai" width="1240" height="2204" loading="lazy" decoding="async">
        </picture>
      </figure>
      <figure id="s04" data-full="s04">
        <picture>
          <source srcset="s04.webp" type="image/webp">
          <img src="s04.jpg" alt="Kids menu" width="1240" height="2204" loading="lazy" decoding="async">
        </picture>
      </figure>
      <figure id="s05" data-full="s05">
        <picture>
          <source srcset="s05.webp" type="image/webp">
          <img src="s05.jpg" alt="Vegetarian breakfast" width="1240" height="2204" loading="lazy" decoding="async">
        </picture>
      </figure>
      <figure id="s06" data-full="s06">
        <picture>
          <source srcset="s06.webp" type="image/webp">
          <img src="s06.jpg" alt="Non-vegetarian breakfast" width="1240" height="2204" loading="lazy" decoding="async">
        </picture>
      </figure>
      <figure id="s07" data-full="s07">
        <picture>
          <source srcset="s07.webp" type="image/webp">
          <img src="s07.jpg" alt="Vegetarian starters" width="1240" height="2204" loading="lazy" decoding="async">
        </picture>
      </figure>
      <figure id="s08" data-full="s08">
        <picture>
          <source srcset="s08.webp" type="image/webp">
          <img src="s08.jpg" alt="Non-vegetarian starters" width="1240" height="2204" loading="lazy" decoding="async">
        </picture>
      </figure>
      <figure id="s09" data-full="s09">
        <picture>
          <source srcset="s09.webp" type="image/webp">
          <img src="s09.jpg" alt="Vegetarian main course" width="1240" height="2204" loading="lazy" decoding="async">
        </picture>
      </figure>
      <figure id="s10" data-full="s10">
        <picture>
          <source srcset="s10.webp" type="image/webp">
          <img src="s10.jpg" alt="Non-vegetarian main course" width="1240" height="2204" loading="lazy" decoding="async">
        </picture>
      </figure>
    </div>

    <p class="foot">Prices in &#8377;. Menu subject to availability.</p>
  </div>

  <div id="zoom" aria-hidden="true"></div>
  <button id="close" aria-label="Close zoom">&times;</button>

<script>
(function () {
  var zoom = document.getElementById('zoom');
  var close = document.getElementById('close');

  function open(base) {
    zoom.innerHTML = '';
    var img = new Image();
    img.src = base + '.jpg';
    img.alt = 'Menu section, zoomed';
    // render wider than the screen so text is comfortably readable, then let the user scroll
    img.style.width = Math.round(Math.max(window.innerWidth * 1.6, 760)) + 'px';
    zoom.appendChild(img);
    zoom.classList.add('open');
    close.style.display = 'block';
    zoom.scrollTop = 0;
    zoom.scrollLeft = 0;
    document.body.style.overflow = 'hidden';
  }

  function shut() {
    zoom.classList.remove('open');
    close.style.display = 'none';
    zoom.innerHTML = '';
    document.body.style.overflow = '';
  }

  document.querySelectorAll('figure[data-full]').forEach(function (f) {
    f.addEventListener('click', function () { open(f.dataset.full); });
  });
  close.addEventListener('click', shut);
  zoom.addEventListener('click', function (e) { if (e.target === zoom) shut(); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') shut(); });

  // light deterrent against casual saving; screenshots are always possible
  document.addEventListener('contextmenu', function (e) {
    if (e.target.tagName === 'IMG') e.preventDefault();
  });
})();
</script>
</body>
</html>
