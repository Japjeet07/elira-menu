<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Elira Stay &middot; Menu</title>
<meta name="theme-color" content="#395126">
<meta name="description" content="The full Elira Stay menu. Tap any section to zoom in.">
<meta property="og:type" content="website">
<meta property="og:title" content="Elira Stay &middot; Menu">
<meta property="og:description" content="The full Elira Stay menu. Tap any section to zoom in.">
<meta property="og:image" content="menu-1200.jpg">
<link rel="preload" as="image" href="part1.webp" type="image/webp">
<style>
  :root {
    --cream: #FFF7E1;
    --amber: #FAB217;
    --green: #395126;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { background: var(--cream); }
  body {
    background: var(--cream);
    color: var(--green);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-text-size-adjust: 100%;
    padding: 0 0 env(safe-area-inset-bottom);
  }
  .wrap { max-width: 1400px; margin: 0 auto; padding: 10px; }
  header { text-align: center; padding: 18px 10px 2px; }
  header .name {
    font-size: 22px;
    font-weight: 800;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--green);
  }
  header .rule {
    width: 54px; height: 3px;
    background: var(--amber);
    border-radius: 2px;
    margin: 10px auto 0;
  }
  .hint {
    text-align: center;
    font-size: 13px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: #8a7a52;
    padding: 12px 10px 14px;
  }
  .sections { display: flex; flex-direction: column; gap: 14px; }
  figure {
    background: #fff;
    border-radius: 14px;
    overflow: hidden;
    box-shadow: 0 1px 3px rgba(57,81,38,.14), 0 8px 24px rgba(57,81,38,.08);
    cursor: zoom-in;
  }
  figure img {
    display: block;
    width: 100%;
    height: auto;
    -webkit-touch-callout: none;
    -webkit-user-select: none;
    user-select: none;
    -webkit-user-drag: none;
  }
  /* desktop: show the three panels side by side, like the printed board */
  @media (min-width: 900px) {
    .sections { flex-direction: row; align-items: flex-start; gap: 16px; }
    .sections figure:nth-child(1) { flex: 613; }
    .sections figure:nth-child(2) { flex: 265; }
    .sections figure:nth-child(3) { flex: 341; }
  }
  /* full-screen zoom view */
  #zoom {
    position: fixed;
    inset: 0;
    background: rgba(28,34,22,.97);
    display: none;
    overflow: auto;
    -webkit-overflow-scrolling: touch;
    z-index: 50;
    padding: 0;
  }
  #zoom.open { display: block; }
  #zoom img {
    display: block;
    max-width: none;
    height: auto;
    margin: 0 auto;
    -webkit-touch-callout: none;
    user-select: none;
  }
  #close {
    position: fixed;
    top: calc(10px + env(safe-area-inset-top));
    right: 12px;
    z-index: 60;
    width: 44px; height: 44px;
    border: 0; border-radius: 50%;
    background: var(--amber);
    color: #2a2008;
    font-size: 24px; line-height: 44px;
    font-weight: 700;
    display: none;
    cursor: pointer;
    box-shadow: 0 2px 10px rgba(0,0,0,.4);
  }
  #zoom.open ~ #close { display: block; }
  .foot {
    text-align: center;
    font-size: 12px;
    color: #a3946c;
    padding: 20px 10px 28px;
  }
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="name">Elira Stay</div>
      <div class="rule"></div>
    </header>
    <p class="hint">Tap a section to zoom &middot; pinch to zoom further</p>
    <div class="sections">
      <figure data-full="part1">
        <picture>
          <source srcset="part1.webp" type="image/webp">
          <img src="part1.jpg" alt="Menu section 1: burritos, soft tacos, rice bowls, quesadillas, nacho bowls and sides" width="1400" height="1988" fetchpriority="high" decoding="async">
        </picture>
      </figure>
      <figure data-full="part2">
        <picture>
          <source srcset="part2.webp" type="image/webp">
          <img src="part2.jpg" alt="Menu section 2: pick your format - burrito, rice bowl, soft tacos, quesadilla, nacho bowl" width="1105" height="3628" loading="lazy" decoding="async">
        </picture>
      </figure>
      <figure data-full="part3">
        <picture>
          <source srcset="part3.webp" type="image/webp">
          <img src="part3.jpg" alt="Menu section 3: choose your hero, rice, house sauces and premium dips" width="1400" height="3572" loading="lazy" decoding="async">
        </picture>
      </figure>
    </div>
    <p class="foot">Prices in &#8377;. Menu subject to availability.</p>
  </div>

  <div id="zoom" aria-hidden="true"></div>
  <button id="close" aria-label="Close zoom">&times;</button>

<script>
(function () {
  var zoom = document.getElementById('zoom');
  var close = document.getElementById('close');

  function open(base) {
    zoom.innerHTML = '';
    var img = new Image();
    img.src = base + '.jpg';
    img.alt = 'Menu section, zoomed';
    // render wider than the screen so text is comfortably readable, then let the user scroll
    img.style.width = Math.round(Math.max(window.innerWidth * 1.9, 820)) + 'px';
    zoom.appendChild(img);
    zoom.classList.add('open');
    close.style.display = 'block';
    zoom.scrollTop = 0;
    zoom.scrollLeft = 0;
    document.body.style.overflow = 'hidden';
  }

  function shut() {
    zoom.classList.remove('open');
    close.style.display = 'none';
    zoom.innerHTML = '';
    document.body.style.overflow = '';
  }

  document.querySelectorAll('figure[data-full]').forEach(function (f) {
    f.addEventListener('click', function () { open(f.dataset.full); });
  });
  close.addEventListener('click', shut);
  zoom.addEventListener('click', function (e) { if (e.target === zoom) shut(); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') shut(); });

  // light deterrent against casual saving; screenshots are always possible
  document.addEventListener('contextmenu', function (e) {
    if (e.target.tagName === 'IMG') e.preventDefault();
  });
})();
</script>
</body>
</html>
